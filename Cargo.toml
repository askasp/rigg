[package]
name = "rigg"
version = "0.1.0"
edition = "2021"
description = "Pipeline runner for AI coding agents on Herdr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
